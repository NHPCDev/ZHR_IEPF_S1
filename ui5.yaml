# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.nhpc.zhriepfs1
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://vhnpddnhci.sap.nhpc.in:44300
            destination: s4hanadest
            #  Start of Change: 08.10.2026 : Balamurugan : Financial Year and Month-Year Fields Added
          - path: /malware_api
            destination: malwarescandest
            pathPrefix: /
            # End of Change: 08.10.2026 : Balamurugan : Financial Year and Month-Year Fields Added
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
          path: test/flpSandbox.html
          intent:
            object: comnhpczhriepfs1
            action: display
